name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright pyinstaller
      - run: pyinstaller --onefile --windowed --name MUJ-Feedback-Helper --collect-all playwright muj_feedback_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: MUJ-Feedback-Helper
          path: dist/MUJ-Feedback-Helper.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/MUJ-Feedback-Helper.exe
